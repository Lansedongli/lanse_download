; 帝国下载系统 E-Down PHP 配置
; 适用于 PHP 8.3 FPM

[PHP]
memory_limit = 256M
max_execution_time = 300
post_max_size = 100M
upload_max_filesize = 100M
default_charset = UTF-8
date.timezone = Asia/Shanghai
max_input_vars = 3000

; OPcache 生产环境优化
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE:-1}
opcache.revalidate_freq = ${PHP_OPCACHE_REVALIDATE:-60}

; Session（生产用 Redis，开发/冒烟测试可回退 file）
session.save_handler = ${PHP_SESSION_HANDLER:-files}
session.save_path = ${PHP_SESSION_PATH:-/tmp}

; 错误报告
display_errors = ${PHP_DISPLAY_ERRORS:-Off}
display_startup_errors = ${PHP_DISPLAY_ERRORS:-Off}
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
log_errors = On
error_log = /var/log/php_errors.log

; 文件上传
file_uploads = On
max_file_uploads = 50
