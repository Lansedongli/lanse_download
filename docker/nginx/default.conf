server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # ── 全局安全头部 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 禁止访问 runtime 日志和敏感文件
    location ~ ^/(runtime|vendor|\.env|composer\.(json|lock)|think)$ {
        deny all;
        return 404;
    }

    # 访问日志
    access_log /var/log/nginx/edown_access.log;
    error_log /var/log/nginx/edown_error.log warn;

    # 静态文件
    location /static/ {
        alias /var/www/html/public/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /uploads/ {
        alias /var/www/html/public/uploads/;
        expires 7d;
    }

    # ThinkPHP 伪静态
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP 处理
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 上传限制
    client_max_body_size 100m;
    client_body_timeout 60s;
}
