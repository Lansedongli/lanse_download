services:
  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:1.24-alpine
    container_name: edown_nginx
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - edown_static:/var/www/html/public/static
    depends_on:
      - php
    networks:
      - edown_net
    restart: unless-stopped

  # ========== PHP 8.3 FPM ==========
  php:
    build: .
    container_name: edown_php
    volumes:
      - ./backend:/var/www/html
      - edown_static:/var/www/html/public/static
      - ./docker/supervisord.conf:/etc/supervisord.conf:ro
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: empiredown
      DB_USERNAME: edown
      DB_PASSWORD: edown_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - edown_net
    restart: unless-stopped

  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0
    container_name: edown_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: empiredown
      MYSQL_USER: edown
      MYSQL_PASSWORD: edown_secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/mysql/schema_full.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    networks:
      - edown_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Redis 6.2+ ==========
  redis:
    image: redis:7-alpine
    container_name: edown_redis
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - edown_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Queue Worker (可选) ==========
  queue:
    build: .
    container_name: edown_queue
    command: ["sh", "-c", "sleep 10 && php think queue:listen --queue default"]
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: mysql
      DB_DATABASE: empiredown
      DB_USERNAME: edown
      DB_PASSWORD: edown_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edown_net
    restart: on-failure:5

volumes:
  mysql_data:
  redis_data:
  edown_static:

networks:
  edown_net:
    driver: bridge
