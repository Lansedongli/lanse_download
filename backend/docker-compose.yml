version: '3.8'

# ============================================
# 帝国下载系统 V3.0 Docker 编排
# ThinkPHP 8.1 + PHP 8.1 + MySQL 8.0 + Redis
# ============================================

services:
  # Nginx 反向代理 + 静态资源
  nginx:
    image: nginx:1.25-alpine
    container_name: edown_nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      php:
        condition: service_healthy
    networks:
      - edown_net
    restart: unless-stopped

  # PHP-FPM 应用服务
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: "${PHP_VERSION:-8.1}"
    container_name: edown_php
    volumes:
      - .:/var/www/html:rw
      - php_socket:/var/run/php
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-empiredown}
      - DB_USERNAME=${DB_USERNAME:-edown}
      - DB_PASSWORD=${DB_PASSWORD:-edown_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - edown_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 3s
      retries: 3

  # MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: edown_mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-empiredown}
      MYSQL_USER: ${DB_USERNAME:-edown}
      MYSQL_PASSWORD: ${DB_PASSWORD:-edown_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - edown_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: edown_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - edown_net
    restart: unless-stopped

  # 静态生成 Worker (队列消费者)
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: "${PHP_VERSION:-8.1}"
    container_name: edown_worker
    command: php think queue:listen redis
    volumes:
      - .:/var/www/html:rw
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-empiredown}
      - DB_USERNAME=${DB_USERNAME:-edown}
      - DB_PASSWORD=${DB_PASSWORD:-edown_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - edown_net
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  php_socket:
    driver: local

networks:
  edown_net:
    driver: bridge
